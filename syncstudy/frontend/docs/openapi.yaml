openapi: 3.0.3
info:
  title: SyncStudy API
  description: >
    Spécification de référence (CDC §5) pour une future API REST Spring Boot / Node.
    Le frontend actuel utilise des mocks ; les chemins correspondent à `src/app/core/api/api.constants.ts`.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Spring Boot (exemple)
  - url: http://localhost:3000/api
    description: Serveur Node actuel (healthcheck uniquement)
paths:
  /auth/login:
    post:
      summary: Connexion JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Tokens émis
  /users/me:
    get:
      summary: Profil connecté
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /subjects:
    get:
      summary: Liste des matières
      tags: [Planning]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /sessions:
    get:
      summary: Sessions (filtres date)
      tags: [Planning]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /groups:
    get:
      summary: Mes groupes
      tags: [Collaboration]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /health:
    get:
      summary: Santé du service Node (préfixe /api)
      tags: [Meta]
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
