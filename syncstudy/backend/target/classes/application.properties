spring.application.name=syncstudy
server.port=8080
server.servlet.context-path=/api

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/syncstudy}
spring.data.mongodb.database=syncstudy

# Dev : valeur par défaut fournie pour faciliter le démarrage local.
# Production : OBLIGATOIRE de définir la variable d'environnement JWT_SECRET
# avec une clé aléatoire d'au moins 32 caractères (ex: openssl rand -base64 32).
app.jwt.secret=${JWT_SECRET:syncstudy-dev-secret-MUST-change-in-production-32b}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

socketio.host=0.0.0.0
socketio.port=9092
