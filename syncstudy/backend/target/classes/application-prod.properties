spring.application.name=syncstudy
server.port=8080
server.servlet.context-path=/api

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/syncstudy}
spring.data.mongodb.database=syncstudy

app.jwt.secret=${JWT_SECRET:CHANGE_ME_256_BIT_SECRET_KEY_SYNCSTUDY_2026}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=${CORS_ORIGINS:https://YOUR_PROD_DOMAIN}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

socketio.host=0.0.0.0
socketio.port=9092
